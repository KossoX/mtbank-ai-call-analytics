services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    environment:
      PIPELINES_API_KEY: "0p3n-w3bu!"
    ports:
      - "9099:9099"
    volumes:
      - pipelines_data:/app/pipelines
      - openwebui_data:/app/backend/data:ro
      - ./pipeline.py:/app/pipelines/mtbank_call_analytics.py:ro
    depends_on:
      - api
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - pipelines
    restart: unless-stopped

volumes:
  whisper_cache:
  pipelines_data:
  openwebui_data: