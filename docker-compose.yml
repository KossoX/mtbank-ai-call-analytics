services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper_cache: